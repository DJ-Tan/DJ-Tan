<svg xmlns="http://www.w3.org/2000/svg" width="600" height="320" viewBox="0 0 600 320" role="img" aria-label="PillBot: the app's pill grid syncs through MySQL to a dispenser carousel dropping a dose"><title>PillBot: the app's pill grid syncs through MySQL to a dispenser carousel dropping a dose</title><style>
.m{font-family:'JetBrains Mono', ui-monospace, SFMono-Regular, Consolas, Menlo, monospace}.s{font-family:Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif}
